<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XcLENCE</title>
<style>
/* XcLENCE - follows the workshop mock-up (navy headers, blue labels, light-blue ground).
 * One type scale, one spacing scale, one control height - so every page has the same proportions.
 * Single light theme by design (matches the PTT mock-up).
 */
:root {
  /* colour */
  --navy: #1f1d5c; --navy-2: #0f2d6b; --blue: #1565c0; --blue-l: #2b9be6; --sky: #29a9e1;
  --label: #1667b2; --ink: #1d2433; --ink-2: #3b4559; --muted: #6a7487; --line: #dbe4ef; --line-2: #eef1f5;
  --ground: #eaf2fb; --card: #fff; --field: #eef1f5; --row: #eef1f6; --row-2: #e4e9f1;
  --ok: #1f9d55; --ok-bg: #e2f6ea; --ok-btn: #1e9e57; --warn: #b7791f; --warn-bg: #fff4d6; --bad: #d64545; --bad-bg: #fde8e8;
  --gold: #f6c75c; --pink: #f8e8ef; --pink-line: #f0d3df; --today: #f2c14e; --msline: #e53935;
  /* type scale */
  --fs-xs: 11px; --fs-sm: 12px; --fs-base: 13px; --fs-md: 14px; --fs-lg: 16px; --fs-xl: 20px;
  /* spacing scale */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px;
  /* sizes */
  --ctl: 32px; --ctl-sm: 26px; --r-ctl: 7px; --r-card: 12px; --side-w: 216px; --top-h: 52px;
  --font: "Segoe UI", "Leelawadee UI", "Noto Sans Thai", Tahoma, system-ui, sans-serif;
  --display: "Century Gothic", "Segoe UI", "Leelawadee UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font: var(--fs-base)/1.5 var(--font); color: var(--ink); background: var(--ground) linear-gradient(180deg, #dcebfa 0, var(--ground) 240px) no-repeat; min-height: 100vh; }
a { color: var(--blue); }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font: 700 var(--fs-xl)/1.3 var(--display); color: var(--label); display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; }
h2 { font-size: var(--fs-md); font-weight: 700; color: var(--label); margin-bottom: var(--s3); }
h2 small, h1 small { font-size: var(--fs-sm); font-weight: 400; color: var(--muted); margin-left: var(--s1); }
h3.sec { font-size: var(--fs-base); font-weight: 700; color: var(--label); margin: var(--s4) 0 var(--s2); }
h3.sec:first-child { margin-top: 0; }
.muted { color: var(--muted); } .small { font-size: var(--fs-sm); }
.num { font-variant-numeric: tabular-nums; }
.r { text-align: right; } .empty { text-align: center; color: var(--muted); padding: var(--s4) !important; }
.okt { color: var(--ok); font-weight: 600; } .warnt { color: var(--warn); font-weight: 600; } .bad { color: var(--bad); }
.req { color: var(--bad); font-style: normal; margin-left: 2px; }
:focus-visible { outline: 2px solid var(--blue-l); outline-offset: 2px; }
.ico { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.row { display: flex; gap: var(--s2); align-items: center; } .row.between { justify-content: space-between; } .row.center { justify-content: center; margin: var(--s3) 0; }
.row.wrap, .wrap { flex-wrap: wrap; }

/* ---------- buttons ---------- */
.btn { font: 600 var(--fs-base)/1 var(--font); height: var(--ctl); border: 1px solid transparent; border-radius: var(--r-ctl); padding: 0 var(--s4); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; white-space: nowrap; }
.btn.sm { height: var(--ctl-sm); padding: 0 var(--s3); font-size: var(--fs-sm); }
.btn.wide { width: 100%; height: 38px; }
.btn.navy { background: var(--navy-2); color: #fff; } .btn.blue { background: var(--blue); color: #fff; }
.btn.green { background: var(--ok-btn); color: #fff; } .btn.red { background: #e53935; color: #fff; }
.btn.yellow { background: #fbc531; color: #3a2c00; }
.btn.red-o { background: #fff; color: var(--bad); border-color: #efb4b4; } .btn.ghost { background: #fff; color: var(--navy-2); border-color: var(--line); }
.btn:hover:not(:disabled) { filter: brightness(1.07); } .btn:disabled { opacity: .45; cursor: not-allowed; }
.iconbtn { background: none; border: 0; color: var(--navy); cursor: pointer; padding: 6px; border-radius: 8px; display: inline-flex; position: relative; }
.iconbtn .ico { width: 20px; height: 20px; }
.badge { position: absolute; top: 0; right: 0; background: var(--bad); color: #fff; border-radius: 8px; font-size: 10px; min-width: 16px; height: 16px; display: grid; place-items: center; padding: 0 4px; }

/* ---------- top bar & layout ---------- */
.topbar { height: var(--top-h); background: #fff; display: flex; align-items: center; gap: var(--s3); padding: 0 var(--s4); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
.brand img { height: 32px; display: block; }
.tb-right { margin-left: auto; display: flex; align-items: center; gap: var(--s3); }
.userchip { display: flex; align-items: center; gap: var(--s2); background: #f4f7fb; border: 1px solid var(--line); border-radius: 8px; padding: 3px 4px 3px var(--s3); }
.userchip b { display: block; font-size: var(--fs-xs); } .userchip small { display: block; font-size: 10px; color: var(--muted); text-align: right; }
.avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--navy); color: #fff; display: grid; place-items: center; font-size: var(--fs-xs); font-weight: 700; }
.layout { display: flex; min-height: calc(100vh - var(--top-h)); }
.main { flex: 1; min-width: 0; padding: var(--s4) var(--s5) var(--s5); }
.side { width: var(--side-w); flex: none; background: rgba(255,255,255,.78); border-right: 1px solid var(--line); padding: var(--s3) var(--s2); position: sticky; top: var(--top-h); height: calc(100vh - var(--top-h)); overflow-y: auto; }
.side.collapsed { display: none; }
.sgroup + .sgroup { margin-top: var(--s3); padding-top: var(--s3); border-top: 1px solid var(--line); }
.sg-h { font-size: var(--fs-md); font-weight: 700; padding: 0 var(--s2) 6px; } .sg-h small { color: var(--muted); font-size: var(--fs-xs); font-weight: 400; margin-left: var(--s1); }
.side a, .side summary { display: flex; align-items: center; gap: var(--s2); min-height: var(--ctl); padding: 0 10px; border-radius: 8px; color: var(--ink); text-decoration: none; font-size: var(--fs-base); cursor: pointer; }
.side summary { font-weight: 600; list-style: none; } .side summary::-webkit-details-marker { display: none; }
.side details a { padding-left: 34px; min-height: 28px; color: var(--ink-2); }
.side a:hover, .side summary:hover { background: #e9f1fa; }
.side a.on { background: var(--blue-l); color: #fff; font-weight: 600; }
.side a.tab { font-weight: 600; }
.rdot { width: 6px; height: 6px; border-radius: 50%; background: var(--bad); margin-left: auto; }
.side a.on .rdot { background: #fff; }

/* ---------- page parts ---------- */
.pagehead { margin-bottom: var(--s3); } .crumb { font-size: var(--fs-xs); color: var(--muted); font-weight: 600; margin-bottom: 2px; }
.namepill { font: 600 var(--fs-md) var(--font); color: var(--ink); background: #dfe5ee; border-radius: 12px; padding: 1px var(--s3); max-width: 560px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.savestate { margin-left: auto; font: 600 var(--fs-sm) var(--font); color: var(--ok); background: var(--ok-bg); border-radius: 12px; padding: 2px 10px; display: inline-flex; align-items: center; gap: 6px; }
.savestate.busy { color: var(--warn); background: var(--warn-bg); }
.dotpulse { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: pulse 1s infinite alternate; }
@keyframes pulse { from { opacity: .3; } to { opacity: 1; } }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-card); margin-bottom: var(--s3); }
.card.pad { padding: var(--s4); }
.notice { display: flex; gap: var(--s2); align-items: center; background: #e8f3fd; border: 1px solid #bcdcf6; color: #1b4f80; border-radius: 10px; padding: var(--s2) var(--s3); margin-bottom: var(--s3); font-size: var(--fs-base); }
.notice.warn { background: var(--warn-bg); border-color: #f1d58b; color: #6b4c05; }
.confirmbar { display: flex; gap: var(--s2); align-items: center; flex-wrap: wrap; background: #fff8e1; border: 1px solid #f3c64f; border-left: 4px solid #f0a500; color: #5b4300; border-radius: 10px; padding: var(--s2) var(--s3); margin-bottom: var(--s3); }
.confirmbar span { flex: 1; min-width: 240px; }
.chip { display: inline-block; background: #dfe5ee; border-radius: 10px; padding: 1px 10px; font-size: var(--fs-xs); font-weight: 600; color: var(--ink-2); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }

/* ---------- pills & stages ---------- */
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 12px; padding: 1px 10px; font-size: var(--fs-sm); font-weight: 600; white-space: nowrap; }
.pill i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.g { background: var(--ok-bg); color: var(--ok); } .pill.a { background: var(--warn-bg); color: var(--warn); }
.pill.n { background: #e6e9ef; color: #5b6578; } .pill.r { background: var(--bad-bg); color: var(--bad); } .pill.b { background: #e1effc; color: var(--blue); }
.stg { display: inline-block; min-width: 28px; text-align: center; border-radius: 6px; padding: 1px 6px; font-weight: 700; font-size: var(--fs-sm); background: #e6ebf3; color: var(--navy); }
.stg.sL4, .stg.sL5 { background: var(--ok-bg); color: var(--ok); }
.st.ok { color: var(--ok); font-weight: 600; } .st.bad { color: var(--bad); font-weight: 600; } .st.muted { color: var(--muted); }

/* ---------- KPI tiles ---------- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: var(--s2); margin-bottom: var(--s3); }
.kpis.sm { margin: var(--s3) 0; }
.kpi { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 10px var(--s3); text-decoration: none; color: var(--ink); min-width: 0; }
.kpis.sm .kpi { background: var(--pink); border-color: var(--pink-line); }
.kpi label { display: block; color: var(--label); font-weight: 700; font-size: var(--fs-sm); line-height: 1.3; }
.kpi label small { display: block; font-weight: 400; font-size: var(--fs-xs); color: var(--muted); }
.kpi b { display: block; font-size: 17px; font-weight: 700; margin-top: 6px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.kpi b small { font-size: var(--fs-sm); font-weight: 600; color: var(--muted); }
.kpi.dim { opacity: .45; } .kpi.warn b { color: var(--bad); } .kpi.link:hover { border-color: var(--blue-l); }

/* ---------- tables ---------- */
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
table.grid th { background: var(--navy); color: #fff; font-size: var(--fs-sm); font-weight: 700; text-align: left; padding: 9px 10px; white-space: nowrap; }
table.grid td { background: var(--row); padding: 7px 10px; border-bottom: 2px solid #fff; vertical-align: middle; }
table.grid tr:nth-child(even) td { background: var(--row-2); }
table.grid.dense td, table.grid.dense th { padding: 6px 8px; font-size: var(--fs-sm); }
.idlink { font-weight: 700; color: var(--navy-2); }
table.list th { text-align: left; font-size: var(--fs-sm); color: var(--label); border-bottom: 1.5px solid var(--navy); padding: 6px 8px; }
table.list td { border-bottom: 1px solid var(--line); padding: 7px 8px; vertical-align: top; }
table.list td a { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; text-decoration: none; }
table.tl tr.curr td { background: #eef6fe; }
table.tl input[type=date] { max-width: 170px; }
.tls { font-weight: 600; white-space: nowrap; } .tls.Completed { color: var(--ok); } .tls.Current { color: var(--blue); } .tls.NotStarted { color: var(--muted); }
.linked { display: inline-block; background: #fff3b0; border-radius: 4px; padding: 1px 6px; font-weight: 600; font-size: var(--fs-sm); }
.linknote { display: block; margin-top: 3px; font-size: var(--fs-xs); font-weight: 600; color: var(--warn); }
.linknote.ms { color: var(--msline); }
td.warnt { color: var(--warn); font-weight: 600; } td.okt { color: var(--ok); font-weight: 600; }

/* ---------- forms ---------- */
input, select, textarea { font: var(--fs-base) var(--font); color: var(--ink); background: var(--field); border: 1px solid transparent; border-radius: var(--r-ctl); padding: 0 10px; width: 100%; height: var(--ctl); }
textarea { height: auto; min-height: 64px; padding: 7px 10px; resize: vertical; line-height: 1.45; }
input:focus, select:focus, textarea:focus { background: #fff; border-color: var(--blue-l); outline: none; }
input:disabled, select:disabled, textarea:disabled { color: #4b5466; cursor: not-allowed; }
input[type=checkbox], input[type=radio] { width: auto; height: auto; accent-color: var(--blue); }
.fgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s3) var(--s4); margin-bottom: var(--s2); }
.fgrid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.fld { display: flex; flex-direction: column; gap: var(--s1); margin-bottom: var(--s3); min-width: 0; }
.fgrid .fld { margin-bottom: 0; }
.fld > label { font-weight: 600; font-size: var(--fs-sm); color: var(--label); }
.fld > label small { font-weight: 400; color: var(--muted); }
.fld.full { grid-column: 1 / -1; } .fld.span2 { grid-column: span 2; } .fld.span3 { grid-column: span 3; }
.fld.inline { flex-direction: row; align-items: center; gap: 10px; margin: 0; }
.fld.inline input { width: 140px; }
.fld.miss input, .fld.miss select, .fld.miss textarea, .fld.miss .multi summary { border-color: #f0a8a8; background: #fff6f6; }
.rofield { background: #f3f5f8; border-radius: var(--r-ctl); padding: 0 10px; min-height: var(--ctl); display: flex; align-items: center; white-space: pre-wrap; }
.fld.tall .rofield { min-height: 60px; align-items: flex-start; padding-top: 7px; }
.check { display: flex; gap: var(--s2); align-items: center; margin-top: var(--s3); font-weight: 600; }
.yn { display: inline-flex; gap: 6px; }
.ynb { font: 700 var(--fs-base) var(--font); height: var(--ctl-sm); border: 0; border-radius: 6px; padding: 0 var(--s4); cursor: pointer; background: #e6e9ef; color: #4b5466; }
.ynb.y.on { background: #20c55e; color: #fff; } .ynb.n.on { background: #f15b5b; color: #fff; }
.ynb:disabled { cursor: not-allowed; }
.multi { position: relative; }
.multi summary { list-style: none; background: var(--field); border: 1px solid transparent; border-radius: var(--r-ctl); height: var(--ctl); line-height: calc(var(--ctl) - 2px); padding: 0 10px; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.multi summary::-webkit-details-marker { display: none; }
.multi.sm summary { height: var(--ctl-sm); line-height: calc(var(--ctl-sm) - 2px); font-size: var(--fs-sm); max-width: 260px; }
.multilist { position: absolute; z-index: 15; left: 0; right: 0; min-width: 260px; max-height: 260px; overflow-y: auto; background: #fff; border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(20,40,80,.15); padding: 6px; }
.multilist label { display: flex; gap: var(--s2); align-items: center; padding: 4px 6px; border-radius: 6px; font-size: var(--fs-sm); }
.multilist label:hover { background: #f1f6fc; } .multilist small { color: var(--muted); margin-left: auto; }
.subtabs { display: flex; gap: 6px; margin-bottom: -1px; position: relative; z-index: 1; }
.subtabs button { font: 600 var(--fs-base) var(--font); height: var(--ctl); border: 1px solid var(--line); border-bottom: 0; background: #fff; color: var(--muted); border-radius: 10px 10px 0 0; padding: 0 var(--s4); cursor: pointer; }
.subtabs button.on { background: #cfeafc; color: var(--navy-2); }
.subtabs + .card { border-top-left-radius: 0; }

/* ---------- initiative page ---------- */
.initgrid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: var(--s4); align-items: start; }
.initmain { min-width: 0; container-type: inline-size; }
.sumbar { display: grid; grid-template-columns: minmax(120px, 1.1fr) minmax(84px, .65fr) minmax(250px, 2.6fr) minmax(100px, 1fr) minmax(110px, 1fr) minmax(80px, .7fr); padding: var(--s3) 0; }
.sb { padding: 0 var(--s3); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.sb:last-child { border-right: 0; }
.sb > label { color: var(--label); font-size: var(--fs-sm); font-weight: 700; line-height: 1.25; }
.sb > label small { display: block; font-size: 10px; font-weight: 400; color: var(--muted); }
.initno { font-size: var(--fs-lg); font-weight: 700; color: var(--blue); }
.big { font-size: var(--fs-xl); font-weight: 700; line-height: 1.1; } .sb > small { color: var(--muted); font-size: var(--fs-xs); }
.mid { font-size: var(--fs-lg); font-weight: 700; overflow: hidden; text-overflow: ellipsis; } .mid small { font-size: var(--fs-xs); color: var(--muted); font-weight: 600; }
.route { list-style: none; display: flex; padding: 2px 0 0; margin: 0; }
.rt { position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center; font-size: 10px; color: var(--muted); line-height: 1.2; }
.rt::before { content: ""; position: absolute; top: 12px; left: -50%; width: 100%; height: 4px; background: #c9d1dc; z-index: 0; }
.rt:first-child::before { display: none; }
.rt.done::before, .rt.cur::before { background: var(--sky); }
.bub { position: relative; z-index: 1; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: var(--fs-sm); font-weight: 700; background: #fff; border: 2px solid #b6c0cd; color: var(--ink); margin-bottom: 3px; }
.rt.done .bub { background: var(--sky); border-color: #fff; color: #fff; box-shadow: 0 0 0 2px var(--sky); }
.rt.pend .bub { background: var(--gold); border-color: #fff; box-shadow: 0 0 0 2px var(--gold); }
.rt.skip .bub { background: #eceff3; color: #b6bdc8; border-style: dashed; }
.rt.cur small { color: var(--ink); font-weight: 700; }
.rt .tip { display: none; position: absolute; top: 38px; left: 50%; transform: translateX(-50%); z-index: 30; width: 320px; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 28px rgba(20,40,80,.18); padding: 10px var(--s3); text-align: left; color: var(--ink); font-size: var(--fs-sm); }
.rt:hover .tip, .rt:focus .tip, .rt:focus-within .tip { display: block; }
.tip-h { font-weight: 700; color: var(--label); margin-bottom: 6px; }
.tip-r { display: flex; justify-content: space-between; gap: var(--s2); padding: 4px 0; border-top: 1px solid var(--line-2); }
.tip-r em { color: var(--muted); font-style: normal; } .tip-r .st { white-space: nowrap; }
.gatebox { padding: var(--s3) var(--s4); border-left: 4px solid var(--gold); }
.gatebox.mine { border-left-color: var(--blue); background: #f6fbff; }
.gb-h { display: flex; justify-content: space-between; flex-wrap: wrap; gap: var(--s2); } .gb-h span { color: var(--muted); font-size: var(--fs-sm); }
.siglist { list-style: none; padding: 0; margin: var(--s2) 0 0; }
.siglist li { display: flex; gap: var(--s2); align-items: baseline; padding: 2px 0; } .siglist li.ok { color: var(--ok); } .siglist .mark { width: 14px; font-weight: 700; }
.gb-hint { display: flex; gap: 6px; align-items: center; margin: var(--s2) 0 0; color: var(--blue); font-size: var(--fs-sm); }

/* bottom action bar: approver row + owner row */
.actionbar { position: sticky; bottom: 0; z-index: 6; display: flex; flex-direction: column; gap: var(--s2); padding: var(--s3); background: rgba(234,242,251,.96); border: 1px solid var(--line); border-radius: var(--r-card); margin-top: var(--s2); box-shadow: 0 -6px 18px rgba(30,60,110,.06); }
.actionbar.ro { flex-direction: row; align-items: center; color: var(--muted); font-size: var(--fs-base); gap: var(--s2); }
.ab-row { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: var(--s3); }
.ab-sign { display: grid; grid-template-columns: auto minmax(220px, 1fr) auto; gap: var(--s3); background: #fff; border: 1px solid #bcdcf6; border-left: 4px solid var(--blue); border-radius: 10px; padding: var(--s2) var(--s3); }
.ab-sign + .ab-own { border-top: 1px dashed var(--line); padding-top: var(--s2); }
.ab-label b { display: block; font-size: var(--fs-base); color: var(--blue); } .ab-label small { color: var(--muted); font-size: var(--fs-sm); }
.ab-sign textarea { min-height: 44px; }
.ab-btns { display: flex; gap: var(--s2); flex-wrap: wrap; }
.pop { position: relative; } .pop summary { list-style: none; } .pop summary::-webkit-details-marker { display: none; }
.popbody { position: absolute; bottom: 40px; left: 0; width: 280px; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 28px rgba(20,40,80,.18); padding: 10px; display: flex; flex-direction: column; gap: var(--s2); z-index: 10; }
.popbody label { font-weight: 600; font-size: var(--fs-sm); display: flex; flex-direction: column; gap: var(--s1); }
.pendlink { font-size: var(--fs-sm); font-weight: 600; color: var(--bad); }
.done-tag { color: var(--ok); font-weight: 700; }

/* comment log */
.activity { position: sticky; top: calc(var(--top-h) + var(--s3)); padding: var(--s3); max-height: calc(100vh - var(--top-h) - 2 * var(--s3)); display: flex; flex-direction: column; gap: 10px; }
.act-h { display: flex; align-items: center; gap: var(--s2); } .act-h b { font-size: var(--fs-md); color: var(--label); white-space: nowrap; } .act-h select { height: var(--ctl-sm); font-size: var(--fs-sm); }
.cbox { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; } .cbox textarea { min-height: 48px; }
.feed { list-style: none; padding: 0; margin: 0; overflow-y: auto; font-size: var(--fs-sm); }
.feed li { display: grid; grid-template-columns: 12px 1fr; gap: var(--s2); padding: 7px 0; border-bottom: 1px solid var(--line-2); overflow-wrap: anywhere; }
.feed .fh { display: flex; justify-content: space-between; gap: var(--s2); } .feed .fh .muted { font-size: var(--fs-xs); white-space: nowrap; }
.feed .dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 4px; background: var(--blue-l); }
.feed .k-approval .dot { background: var(--ok); } .feed .k-workflow .dot { background: var(--navy); } .feed .k-comment .dot { background: var(--gold); }
.feed .cm { background: #f6f8fb; border-radius: 6px; padding: 4px var(--s2); margin-top: 3px; font-style: italic; }

/* ---------- impact grid (continuous months, pinned Version/Annualized) ---------- */
.gridtools { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2); margin-bottom: var(--s2); }
.gridwrap { border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; }
table.igrid { font-size: var(--fs-sm); width: max-content; min-width: 100%; }
table.igrid th { background: #fff; color: var(--label); font-size: var(--fs-sm); font-weight: 700; border-bottom: 1.5px solid var(--navy); padding: 6px; text-align: left; white-space: nowrap; vertical-align: bottom; }
table.igrid td { padding: 2px 5px; border-bottom: 1px solid var(--line-2); vertical-align: middle; background: #fff; }
table.igrid tr.lastrow td { border-bottom: 1.5px solid #cfd8e4; }
table.igrid td[rowspan] { vertical-align: top; padding-top: var(--s2); background: #fbfcfe; }
table.igrid select { height: var(--ctl-sm); padding: 0 6px; font-size: var(--fs-sm); min-width: 130px; }
.igrid .stk1, .igrid .stk2 { position: sticky; z-index: 2; }
.igrid .stk1 { left: 0; width: 96px; min-width: 96px; }
.igrid .stk2 { left: 96px; width: 96px; min-width: 96px; border-right: 1.5px solid var(--navy); box-shadow: 4px 0 6px -4px rgba(20,40,80,.18); }
.igrid th.stk1, .igrid th.stk2 { z-index: 3; }
.vid { display: block; font-size: 10px; font-weight: 700; color: var(--muted); }
.lid { font-weight: 700; color: var(--muted); } .chk { width: 26px; }
.lfreq { min-width: 170px; }
.mtag { display: inline-block; margin: 4px 0 2px; font-size: 10px; font-weight: 700; border-radius: 8px; padding: 0 var(--s2); background: #d6ecfb; color: var(--blue); }
.mtag.man { background: #fff0c2; color: #8a6200; }
.mode { display: flex; flex-direction: column; font-size: var(--fs-xs); color: var(--muted); }
.ver { color: var(--muted); font-weight: 600; white-space: nowrap; } .v-e .ver, .v-e .annc { color: var(--navy); }
.annc { text-align: right; font-variant-numeric: tabular-nums; }
th.mo { text-align: right; min-width: 70px; }
td.mo { text-align: right; min-width: 70px; font-variant-numeric: tabular-nums; }
td.mo.est { color: var(--navy); font-weight: 600; padding-right: 9px; }
.cell { height: 24px; padding: 0 5px; text-align: right; font-size: var(--fs-sm); background: #f3f6fa; border-radius: 5px; width: 62px; }
.cell.ann { width: 80px; }
.igrid .mo.ys { border-left: 1px solid #c9d3e0; }
.igrid .mo.today { box-shadow: inset 2px 0 0 var(--today); }
.igrid .mo.ms { box-shadow: inset 2px 0 0 var(--msline); }
.igrid .mo.today.ms { box-shadow: inset 2px 0 0 var(--msline), inset 4px 0 0 var(--today); }
.mk { display: block; width: max-content; margin: 0 0 2px auto; font-size: 9.5px; font-weight: 700; line-height: 1.4; border-radius: 3px; padding: 0 4px; }
.mk.ms { background: var(--msline); color: #fff; } .mk.today { background: var(--today); color: #3a2c00; }
.legend { font-size: var(--fs-xs); color: var(--muted); display: inline-flex; flex-wrap: wrap; align-items: center; gap: var(--s1); }
.lg { width: 3px; height: 12px; display: inline-block; margin-left: var(--s2); } .lg.today { background: var(--today); } .lg.ms { background: var(--msline); }
table.ms input, table.ms select { height: var(--ctl-sm); padding: 0 6px; font-size: var(--fs-sm); }
table.ms td:nth-child(3) { min-width: 240px; }

/* ---------- attachments & files ---------- */
.attgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s3) var(--s5); margin-bottom: var(--s2); }
.att { display: flex; gap: var(--s2); align-items: center; } .att .rofield { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.browse { cursor: pointer; }
.files { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.file { display: flex; gap: var(--s2); align-items: center; }
.ftype { background: var(--bad); color: #fff; font: 700 9px var(--font); border-radius: 3px; padding: 2px 4px; }
.x { border: 0; background: none; color: var(--bad); cursor: pointer; font-size: var(--fs-base); }

/* ---------- questionnaire ---------- */
.qrow { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: var(--s4); padding: var(--s3) 0; border-top: 1px solid var(--line); }

.qrow.miss .qq { color: var(--bad); }
.qq { font-style: italic; color: var(--ink-2); }
.qa { display: flex; flex-direction: column; gap: 6px; }
.qopt { display: flex; gap: var(--s2); align-items: flex-start; } .qopt input { margin-top: 3px; }
.qopt.in { display: inline-flex; margin-right: var(--s5); }

.qopt.other { align-items: center; } .qopt.other span { white-space: nowrap; }

/* ---------- new initiative ---------- */
.dq { display: flex; justify-content: space-between; align-items: center; gap: var(--s4); padding: var(--s3) 0; border-top: 1px solid var(--line); }
.dq b { display: block; } .dq small { color: var(--muted); }
.trackres { border-radius: var(--r-card); padding: var(--s3) var(--s4); margin-bottom: var(--s3); border: 1px solid var(--line); background: #fff; }

.tr-h { display: flex; gap: var(--s3); align-items: center; } .tr-h b { font-size: var(--fs-lg); display: block; } .tr-h small { color: var(--muted); }

.tbadge.tM { background: var(--navy); } .tbadge.tS { background: #22a06b; } .tbadge.tP { background: var(--sky); }
.tr-path { margin: 10px 0 6px; display: flex; align-items: center; gap: 6px; } .tr-path i { color: var(--muted); font-style: normal; }
.tr-gates { margin: var(--s1) 0; padding-left: 18px; } .tr-gates b { color: var(--label); margin-right: 6px; }
.tr-tabs { font-size: var(--fs-sm); color: var(--muted); }

/* ---------- search ---------- */
.sfgrid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px var(--s3); margin-top: 10px; }
.sf { display: flex; flex-direction: column; gap: var(--s1); } .sf span { font-weight: 600; font-size: var(--fs-sm); color: var(--label); }
.switch { display: inline-flex; gap: var(--s2); align-items: center; font-weight: 600; }

/* ---------- dashboards ---------- */
.dgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 var(--s3); }
.bars { display: flex; flex-direction: column; gap: var(--s2); }
.bar-r { display: grid; grid-template-columns: 150px 1fr 120px; gap: 10px; align-items: center; font-size: var(--fs-sm); }
.bl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bt { background: #edf1f6; border-radius: 4px; height: 12px; overflow: hidden; }
.bt i { display: block; height: 100%; background: var(--blue); border-radius: 4px; }
.bv { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; } .bv small { color: var(--muted); font-weight: 400; }

/* ---------- admin / prose ---------- */
.listgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: var(--s3); }

.thr { display: inline-flex; align-items: center; gap: var(--s1); font-size: var(--fs-sm); } .thr input { width: 100px; }
.prose { max-width: 900px; } .prose h2 { margin-top: var(--s4); } .prose h2:first-child { margin-top: 0; }

.faq { border-bottom: 1px solid var(--line); padding: 10px 0; } .faq summary { font-weight: 600; cursor: pointer; } .faq p { margin: 6px 0 0; color: var(--ink-2); }

/* ---------- login ---------- */
.loginbg { min-height: 100vh; display: grid; place-items: center; padding: var(--s5) var(--s4); background: radial-gradient(circle at 80% 10%, #b9dcf8, transparent 45%), radial-gradient(circle at 10% 90%, #c7e2f8, transparent 40%), #e9f2fb; }
.logincard { width: 100%; max-width: 420px; background: #fff; border-radius: 24px; padding: 20px 32px var(--s4); box-shadow: 0 20px 50px rgba(40,80,140,.15); display: flex; flex-direction: column; gap: 10px; }
.lc-top { text-align: right; font: 700 var(--fs-base) var(--display); color: var(--navy-2); }
.lc-logo { width: 230px; max-width: 100%; align-self: center; margin: var(--s1) 0 var(--s2); }
.lc-l { display: flex; flex-direction: column; gap: var(--s1); font-weight: 700; } .lc-l small { font-weight: 400; color: var(--muted); }

.lc-foot { display: flex; justify-content: space-between; font-size: var(--fs-xs); color: var(--muted); margin-top: var(--s2); }

/* ---------- toasts ---------- */
#toasts { position: fixed; right: 18px; bottom: 18px; display: flex; flex-direction: column; gap: var(--s2); z-index: 100; max-width: 420px; }
.toast { background: #183153; color: #fff; padding: 10px 14px; border-radius: 10px; box-shadow: 0 8px 22px rgba(0,0,0,.2); font-size: var(--fs-base); }
.toast.bad { background: #a12a2a; }
.err { color: var(--bad); }

/* ---------- responsive ---------- */
/* Summary bar reacts to the width of the initiative column (sidebar + comment log vary), not the window. */
@container (max-width: 1000px) {
  .sumbar { grid-template-columns: repeat(5, minmax(0, 1fr)); row-gap: var(--s3); }
  .sb.wide { grid-column: 1 / -1; order: 10; border-right: 0; border-top: 1px solid var(--line); padding-top: var(--s3); }
  .sb:nth-child(6) { border-right: 0; }
}
@container (max-width: 680px) { .ab-sign { grid-template-columns: 1fr; } }
@container (max-width: 600px) {
  .sumbar { grid-template-columns: repeat(2, minmax(0, 1fr)); }

}
@media (max-width: 1200px) { .initgrid { grid-template-columns: minmax(0, 1fr); } .activity { position: static; max-height: none; } .sfgrid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

  .ab-sign { grid-template-columns: 1fr; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }

// n consecutive months of value v starting at "YYYY-MM"
function xcSer(start, n, v) {
  const o = {}; let [y, m] = start.split("-").map(Number);
  for (let i = 0; i < n; i++) { o[`${y}-${String(m).padStart(2, "0")}`] = v; m++; if (m > 12) { m = 1; y++; } }
  return o;
}

// Build a plausible audit trail from the timeline + sign-offs of a seeded initiative.
function xcAuditFrom(i, users) {
  const nm = id => (users.find(u => u.id === id) || {}).name || "System";
  const ev = [{ when: (i.tl.a.L1 || i.created) + " 09:00", who: nm(i.owner), kind: "workflow", action: "Created initiative" }];
  Object.entries(i.tl.a).forEach(([k, d]) => {
    if (k.startsWith("sub:")) ev.push({ when: d + " 10:00", who: nm(i.owner), kind: "workflow", action: `Submitted for ${k.slice(4)} approval` });
  });
  Object.entries(i.approvals).forEach(([stage, sigs]) => Object.entries(sigs).forEach(([role, s]) =>
    ev.push({ when: s.at, who: s.by, kind: "approval", action: `${XC.ROLES[role].name} approved \u2192 ${stage}` })));
  Object.entries(i.tl.a).forEach(([k, d]) => {
    if (!k.startsWith("sub:") && k !== "L1") ev.push({ when: d + " 18:00", who: "System", kind: "workflow", action: `Advanced to ${k} (all sign-offs complete)` });
  });
  return ev.sort((a, b) => a.when.localeCompare(b.when)).map(e => ({ ...e, comment: "" }));
}

}

function statusPill(i) {

// ---------- initiative page -------------------------------------------------
function route(i) {
  const st = stagesOf(i);
  return `<ol class="route">${XC.STAGE_ORDER.map(s => {
    const inT = st.includes(s), idx = stageNum(s), cur = stageNum(i.stage);
    let cls = !inT ? "skip" : idx <= cur ? "done" : s === i.submittedFor ? "pend" : "todo";
    if (s === i.stage) cls += " cur";
    return `<li class="rt ${cls}" ${inT ? 'tabindex="0"' : ""}><span class="bub">${s}</span><small>${inT ? XC.STAGES[s] : "n/a"}</small>${inT ? `<div class="tip" role="tooltip">${routeTip(i, s)}</div>` : ""}</li>`;
  }).join("")}</ol>`;
}
function routeTip(i, s) {
  if (s === "L1") return `<div class="tip-h">L1 Idea</div><div class="tip-r"><span>Created by ${esc(uname(i.owner))}</span><span class="st ok">${fmtDate(i.tl.a.L1 || i.created)}</span></div>`;
  const roles = gateRoles(i, s), sig = (i.approvals || {})[s] || {}, reached = stageNum(i.stage) >= stageNum(s);
  const head = reached ? `Approved into ${s}` : i.submittedFor === s ? `Waiting for sign-off \u2192 ${s}` : `Sign-off needed \u2192 ${s}`;
  return `<div class="tip-h">${head}</div>` + roles.map(r => {
    const a = sig[r];
    return `<div class="tip-r"><span><b>${esc(a ? a.by : holderNames(r, i))}</b> <em>(${esc(roleName(r))})</em></span>${a ? `<span class="st ok">Approved ${esc(a.at)}</span>` : i.submittedFor === s ? '<span class="st bad">Pending</span>' : '<span class="st muted">Not started</span>'}</div>`;
  }).join("");
}
function sumbar(i) {
  const h = headline(i);
  return `<section class="sumbar card">
    <div class="sb"><label>Initiative No.</label><div class="initno">${i.id}</div><div>${statusPill(i)}</div></div>
    <div class="sb"><label>Stage</label><div class="big">${i.stage}</div><small>${XC.STAGES[i.stage]}</small></div>
    <div class="sb wide"><label>Workflow Route <small>hover a stage to see sign-offs</small></label>${route(i)}</div>
    <div class="sb"><label>${i.track === "S" ? "Flagship" : "Org. or Dept."}</label><div class="mid">${esc((i.track === "S" ? i.flagship : i.dept) || i.company || "\u2014")}</div></div>
    <div class="sb"><label>Total Impact <small>latest est., annualized</small></label><div class="mid">${fmtV(h.v, h.unit)} <small>${h.unit}</small></div></div>
    <div class="sb"><label>Impact Year</label><div class="mid">${impactYear(i)}</div></div>
  </section>`;
}
function gateBox(i) {
  if (!i.submittedFor) return i.returned ? `<div class="notice warn">${ico("info")}<span>This initiative was returned or rejected. Read the comment log, update it and resubmit.</span></div>` : "";
  const to = i.submittedFor, roles = gateRoles(i, to), sig = i.approvals[to] || {}, mine = myPendingRoles(ME, i);
  const rows = roles.map(r => sig[r]
    ? `<li class="ok"><span class="mark">\u2713</span><b>${esc(roleName(r))}</b> \u2014 ${esc(sig[r].by)} <span class="muted">${esc(sig[r].at)}</span></li>`
    : `<li><span class="mark">\u25cb</span><b>${esc(roleName(r))}</b> \u2014 <span class="muted">waiting for ${esc(holderNames(r, i))}</span></li>`).join("");
  return `<div class="gatebox card ${mine.length ? "mine" : ""}">
    <div class="gb-h"><b>Submitted for ${to} approval</b><span>${roles.filter(r => sig[r]).length} of ${roles.length} sign-offs \u00b7 ${daysSince(i.tl.a["sub:" + to])} day(s) pending</span></div>
    <ul class="siglist">${rows}</ul>
    ${mine.length ? `<p class="gb-hint">${ico("info")} Your sign-off is requested \u2014 add a comment and use <b>Approve</b> or <b>Reject</b> at the bottom of the page.</p>` : ""}
  </div>`;
}
// Bottom bar: the approver's row (comment + Approve / Reject) and the owner's row (Cancel / Return / Submit).
function actionBar(i) {
  const mine = myPendingRoles(ME, i), ed = canEdit(ME, i);
  let rows = "";
  if (mine.length) {
    rows += `<div class="ab-row ab-sign">
      <div class="ab-label"><b>Your sign-off \u00b7 ${i.stage} \u2192 ${i.submittedFor}</b><small>as ${esc(mine.map(roleName).join(", "))}</small></div>
      <textarea id="gate_c" rows="2" aria-label="Approval comment" placeholder="Comment \u2014 required to reject, optional to approve"></textarea>
      <div class="ab-btns">${mine.map(r => `<button class="btn green" onclick="doApprove('${r}')">\u2713 Approve${mine.length > 1 ? " as " + esc(roleName(r)) : ""}</button>`).join("")}
        <button class="btn red" onclick="doReject()">\u2715 Reject</button></div></div>`;
  }
  if (ed) {
    const to = nextStage(i), prev = prevStage(i), pend = to ? requirements(i, to).filter(r => !r.done) : [];
    const active = i.status !== "On hold" && i.status !== "Cancelled";
    const why = !active ? `Initiative is ${i.status}` : pend.length ? "Complete the checklist on Timeline & Status first" : "";
    rows += `<div class="ab-row ab-own">
      <details class="pop" ${OPEN === "hold" ? "open" : ""} ontoggle="popToggle(this,'hold')"><summary class="btn red">${active ? "Cancel / On hold" : "Re-activate"}</summary>
        <div class="popbody">${active ? `<label>New status<select id="hold_s"><option>On hold</option><option>Cancelled</option></select></label>` : `<input type="hidden" id="hold_s" value="On track">`}
          <textarea id="hold_c" placeholder="Comment${active ? " (required)" : ""}"></textarea><button class="btn navy sm" onclick="doStatus()">${active ? "Apply" : "Re-activate"}</button></div></details>
      ${prev ? `<details class="pop" ${OPEN === "ret" ? "open" : ""} ontoggle="popToggle(this,'ret')"><summary class="btn yellow">Return to ${prev}</summary>
        <div class="popbody"><textarea id="ret_c" placeholder="Why does it go back? (required)"></textarea><button class="btn navy sm" onclick="doReturn()">Return to ${prev}</button></div></details>` : ""}
      ${i.submittedFor ? `<button class="btn ghost" onclick="doWithdraw()">Withdraw ${i.submittedFor} submission</button>`
        : to ? `<button class="btn blue" onclick="doSubmit()" ${why ? `disabled title="${esc(why)}"` : ""}>Submit to ${to}</button>` : '<span class="done-tag">\u2713 Final stage reached</span>'}
      ${pend.length && !i.submittedFor && to ? `<a class="pendlink" href="#/init/${i.id}/timeline">${pend.length} checklist item(s) pending</a>` : ""}
    </div>`;
  }
  if (!rows) return `<div class="actionbar ro">${ico("info")}<span>Read-only \u2014 your role can view this initiative but not edit it.</span></div>`;
  return `<div class="actionbar">${rows}</div>`;
}
// Confirmation when the Money Step completion date and the L4 forecast date change (they move together).

// ---------- tab: timeline & status ------------------------------------------
function tabTimeline(i, ed) {
  const to = nextStage(i), req = requirements(i, to), st = stagesOf(i), cur = stageNum(i.stage);
  const rows = [];
  st.forEach((s, k) => {
    if (k > 0) rows.push({ label: `Submitted for ${s} approval`, a: i.tl.a["sub:" + s], state: stageNum(s) <= cur ? "Completed" : i.submittedFor === s ? "Current" : "Not Started" });
    rows.push({ label: `${s} (${XC.STAGES[s]})`, a: i.tl.a[s], s, state: stageNum(s) < cur ? "Completed" : s === i.stage ? (k === st.length - 1 ? "Completed" : "Current") : "Not Started" });
  });
  const fc = r => {
    if (!r.s || r.s === "L1") return "";

    if (r.s === "L4") {
      const f4 = forecastDate(i, "L4");
      const note = ms ? `<small class="linknote">\u2194 Money Step #${esc(ms.id)} completion date \u00b7 sets the Impact Year</small>` : `<small class="linknote muted">No Money Step yet \u2014 add one on Project Milestones to link it</small>`;
      if (stageNum("L4") <= cur) return `<span class="linked">${fmtDate(f4)}</span>${note}`;
      return `<input type="date" id="f_tl_f_L4" value="${esc(f4 || "")}" onchange="onL4(this)" aria-label="L4 forecast date" ${dis(ed)}>${note}`;
    }
    if (stageNum(r.s) <= cur) return i.tl.f[r.s] ? `<span class="muted">${fmtDate(i.tl.f[r.s])}</span>` : "";
    return `<input type="date" id="${fid("tl.f." + r.s)}" value="${esc(i.tl.f[r.s] || "")}" data-f="tl.f.${r.s}" data-label="${r.s} forecast date" onchange="onField(this)" ${dis(ed)}>${r.s === "L5" && i.track === "P" ? '<small class="linknote muted">sets the Impact Year</small>' : ""}`;
  };
  const active = i.status !== "On hold" && i.status !== "Cancelled";
  return `<div class="card pad"><h2>A. Checklist Status ${to ? `<small>before submitting for ${to}</small>` : ""}</h2>
      ${to ? `<div class="tablewrap"><table class="list"><thead><tr><th>Tab</th><th>Requirement</th><th>Status</th></tr></thead><tbody>
        ${req.map(r => `<tr><td><a href="#/init/${i.id}/${r.tab}">${ico(TAB_ICON[r.tab])} ${XC.TAB_LABEL[r.tab]}</a></td><td>${esc(r.label)}</td><td>${r.done ? '<span class="st ok">\u25cf Completed</span>' : '<span class="st bad">\u25cf Pending</span>'}</td></tr>`).join("")}
      </tbody></table></div>` : '<p class="okt">Final stage reached \u2014 no further gate.</p>'}</div>
    <div class="card pad"><h2>B. Timeline</h2><div class="tablewrap"><table class="list tl"><thead><tr><th>State</th><th>Stage</th><th>Actual</th><th>Forecast</th></tr></thead><tbody>
      ${rows.map(r => `<tr class="${r.state === "Current" ? "curr" : ""}"><td><span class="tls ${r.state.replace(" ", "")}">${r.state === "Completed" ? "\u25c9" : r.state === "Current" ? "\u25ce" : "\u25cb"} ${r.state}</span></td><td>${esc(r.label)}</td><td>${fmtDate(r.a)}</td><td>${fc(r)}</td></tr>`).join("")}
    </tbody></table></div></div>

      <div class="fld"><label for="f_status">Weekly status</label>${active ? `<select id="f_status" data-f="status" data-label="Weekly status" onchange="onField(this)" ${dis(ed)}>${opts(["On track", "Needs leadership attention"], i.status, null)}</select>` : `<div class="rofield">${esc(i.status)} \u2014 use Re-activate below</div>`}</div>

}

// ---------- tabs: impact & sustainability -----------------------------------
// Continuous month timeline (like WAVE): spans the data, the present month and the Money Step
// start, at least 12 months ahead of today; extendable 12 months either way.
function monthRange(i, key) {
  const present = todayISO().slice(0, 7), ms = msStartYM(i);
  const keys = (i[key] || []).flatMap(l => [...Object.keys((l.m || {}).f || {}), ...Object.keys((l.m || {}).a || {})]).sort();
  const pts = [present, ...(keys.length ? [keys[0], keys[keys.length - 1]] : []), ...(ms ? [ms] : [])].sort();
  let start = pts[0], end = pts[pts.length - 1];
  const minEnd = ymAdd(present, 11); if (end < minEnd) end = minEnd;
  const ext = GRIDEXT[i.id + key] || { b: 0, a: 0 };
  return ymRange(ymAdd(start, -12 * ext.b), ymAdd(end, 12 * ext.a));
}
function impactGrid(i, key, ed) {

      <td rowspan="3" class="lid">#${l.id}</td>

        <div class="mode"><label><input type="radio" name="md_${key}_${l.id}" ${l.mode !== "manual" ? "checked" : ""} onchange="onMode('${key}','${l.id}','auto')" ${dis(ed)}> Auto-fill</label><label><input type="radio" name="md_${key}_${l.id}" ${l.mode === "manual" ? "checked" : ""} onchange="onMode('${key}','${l.id}','manual')" ${dis(ed)}> Manual</label></div></td>
      <td rowspan="3">${lsel(l, "type", L(S ? "susTypes" : "impactTypes"))}</td>
      ${S ? `<td rowspan="3">${lsel(l, "flagship", L("flagships"))}</td><td rowspan="3">${lsel(l, "scope", L("scopes"))}</td>` : `<td rowspan="3">${lsel(l, "pl", L("depts"))}</td>`}` : "";
    const ann = l.mode === "manual" && kind !== "e"
      ? `<input type="number" step="any" class="cell ann" id="an_${key}_${l.id}_${kind}" value="${esc((l.ann || {})[kind] ?? "")}" data-ann="${key}|${l.id}|${kind}" onchange="onAnn(this)" aria-label="${kl} annualized ${l.id}" ${dis(ed)}>`

    const cells = months.map(m => {

  return `<div class="card pad">
    <div class="row between wrap"><div class="row wrap"><h2>${S ? "Sustainability Impact" : "Impact"}</h2><span class="chip">Grouped by Month</span>
      <span class="legend"><i class="lg today"></i>Present month (${fmtDate(todayYM)})

      ${ed ? `<div class="row">${SEL.size ? `<button class="btn red-o sm" onclick="deleteLines('${key}')">Delete selected (${SEL.size})</button>` : ""}<button class="btn blue sm" onclick="addLine('${key}')">+ Add New Impact</button></div>` : ""}</div>
    <div class="gridtools"><button class="btn ghost sm" onclick="extendGrid('${key}','b')">\u25c2 12 months earlier</button>

      ${months.map(thMonth).join("")}</tr></thead>
      <tbody>${body || `<tr><td colspan="${(S ? 8 : 7) + months.length}" class="empty">No impact lines yet${ed ? " \u2014 use \u201c+ Add New Impact\u201d" : ""}.</td></tr>`}</tbody></table></div>
    <p class="muted small">Enter monthly values as positive numbers in ${unit}; the line type decides whether it adds or subtracts. Auto-fill computes the annualized value from the months (see Rulebook); Manual lets you type it. Estimate = Actual where entered, otherwise Forecast.</p>
  </div>`;
}

function msCheck(i, m) {
  const l4 = forecastDate(i, "L4");
  if (m.status === "Cancelled") return ["Milestone cancelled", "muted"];
  if (!m.start || !m.end) return ["Dates missing", "bad"];
  if (m.type !== "Money Step" && l4 && m.end > l4) return ["End date is after L4 date", "bad"];
  if (m.status !== "Completed" && m.end < todayISO()) return ["Late", "bad"];
  return ["OK", "ok"];
}

let NAV = "#/home", SKIP_HASH = null;

// Bring the present month (and the Money Step start, if earlier) into view on the impact grids,
// just right of the pinned Version / Annualized columns.
function afterRender() {
  if (!SCROLL_TODAY) return;
  SCROLL_TODAY = false;

    const today = gw.querySelector("th.today"), ms = gw.querySelector("th.ms"), pin = gw.querySelectorAll("th.stk1, th.stk2");
    let target = today;
    if (ms && today && ms.offsetLeft < today.offsetLeft) target = ms;
    if (!target) return;
    const pinned = [...pin].reduce((w, th) => w + th.offsetWidth, 0);

  e[dir]++; GRIDEXT[k] = e;
  const gw = document.querySelector(".gridwrap"), x = gw ? gw.scrollLeft : 0;
  render();
  const g2 = document.querySelector(".gridwrap");
  if (g2) g2.scrollLeft = dir === "b" ? 0 : x;
}
// Re-render but keep keyboard focus on the same control (onchange fires as focus moves on).
function renderKeep() {
  const a = document.activeElement, id = a && a.id, s = a && a.selectionStart, y = window.scrollY;
  const gw = document.querySelector(".gridwrap"), gx = gw ? gw.scrollLeft : 0;
  render();
  window.scrollTo(0, y);
  const g2 = document.querySelector(".gridwrap"); if (g2) g2.scrollLeft = gx;
  if (id) { const e = document.getElementById(id); if (e) { e.focus(); try { if (s != null && e.setSelectionRange) e.setSelectionRange(s, s); } catch (x) {} } }
}
let LAST_PATH = "";
function onNavigate() {
  commitDraft(false);
  PENDING_LINK = null;
  const p = parse(), path = p.slice(0, 2).join("/");
  if (path !== LAST_PATH) { SEL = new Set(); OPEN = null; if (p[0] !== "init" || p[1] !== LAST_PATH.split("/")[1]) OVSUB = "info"; }
  if (p[0] === "init" && (p[2] === "impact" || p[2] === "sustain")) SCROLL_TODAY = true;
  LAST_PATH = path;
  if (window.innerWidth <= 900) SIDE = false; // overlay menu closes after navigating on small screens
  render(); window.scrollTo(0, 0);
}
window.addEventListener("hashchange", () => {
  if (SKIP_HASH && location.hash === SKIP_HASH) { SKIP_HASH = null; return; }
  if (location.hash.startsWith("#/") && location.hash !== NAV) { NAV = location.hash; onNavigate(); } // back / forward
});
window.addEventListener("beforeunload", () => commitDraft(false));
function toggleSide() { SIDE = !SIDE; render(); }
function popToggle(el, key) { if (el.open) OPEN = key; else if (OPEN === key) OPEN = null; }

// ---------- autosave + comment log -----------------------------------------
// Every change is persisted immediately; a moment after the user stops editing, the changes
// are written to the comment log as one "Updated \u2026: from \u2192 to" entry.
function short(v) { const s = Array.isArray(v) ? v.join(", ") : String(v ?? ""); return s.length > 60 ? s.slice(0, 59) + "\u2026" : s || "\u2205"; }
const same = (a, b) => JSON.stringify(a ?? "") === JSON.stringify(b ?? "");
function markDirty(i, label, from, to) {
  if (DIRTY.id && DIRTY.id !== i.id) commitDraft(false);
  const prev = DIRTY.items.get(label);
  if (!prev && typeof to !== "object" && same(from, to)) return; // nothing actually changed
  DIRTY.id = i.id;
  DIRTY.items.set(label, { from: prev ? prev.from : from, to });
  save();
  setSaveState(true);
  clearTimeout(SAVE_TIMER);
  SAVE_TIMER = setTimeout(autoCommit, AUTOSAVE_MS);
}
function commitDraft() {
  clearTimeout(SAVE_TIMER); SAVE_TIMER = null;
  if (!DIRTY.id || !DIRTY.items.size) return null;
  const id = DIRTY.id, i = INIT(id);
  const changed = [...DIRTY.items.entries()].filter(([, v]) => typeof v.to === "object" || v.to === undefined || !same(v.from, v.to));
  if (i && changed.length) {
    const parts = changed.map(([k, v]) => (typeof v.to === "object" || v.to === undefined) ? k : `${k}: ${short(v.from)} \u2192 ${short(v.to)}`);
    const shown = parts.length > 8 ? parts.slice(0, 8).concat(`and ${parts.length - 8} more`) : parts;
    log(i, "edit", "Updated " + shown.join("; "));
    save();
  }
  DIRTY = { id: null, items: new Map() };
  return id;
}
// Timer-driven commit: update only the save indicator and the comment-log feed, so a field the
// user is typing in right now is never re-rendered away.
function autoCommit() {
  const id = commitDraft();
  setSaveState(false);
  if (id && CUR && CUR.id === id) {
    const feed = document.querySelector(".activity .feed");
    if (feed) feed.outerHTML = feedHtml(CUR);
  }
}
function setSaveState(saving) {
  SAVING = saving;
  const el = document.getElementById("savestate");
  if (el) { el.innerHTML = saveStateHtml(); el.classList.toggle("busy", saving); }
}
const CURI = () => CUR || INIT(ROUTE[1]);
function editable() { const i = CURI(); if (!i || !canEdit(ME, i)) { toast("You can't edit this initiative.", "bad"); return null; } return i; }

// ---------- field handlers --------------------------------------------------
function onField(el) {
  const i = editable(); if (!i) return;
  const p = el.dataset.f, old = getPath(i, p);
  let v = el.type === "checkbox" ? el.checked : el.value;
  if (el.dataset.num) v = el.value === "" ? null : Number(el.value);
  setPath(i, p, v);
  markDirty(i, el.dataset.label || p, old, v);
  renderKeep();
}
function setValue(p, v) {
  const i = editable(); if (!i) return;
  const old = getPath(i, p); setPath(i, p, v);
  markDirty(i, p === "capex.has" ? "Having CAPEX spend" : p === "assumption.has" ? "Having assumption template" : p, old, v);
  renderKeep();
}
function onTeam(uid, on) {
  const i = editable(); if (!i) return;
  const old = [...(i.team || [])];
  i.team = on ? [...new Set([...old, uid])] : old.filter(x => x !== uid);
  markDirty(i, "Working Team", old.map(uname), i.team.map(uname));
  OPEN = "team"; renderKeep();
}
// impact lines ---------------------------------------------------------------
const lineOf = (i, key, id) => (i[key] || []).find(l => l.id === id);
function onLine(el) {
  const i = editable(); if (!i) return;
  const [key, id, k] = el.dataset.line.split("|"), l = lineOf(i, key, id);
  const old = l[k]; l[k] = el.value; markDirty(i, `#${id} ${k}`, old, el.value); renderKeep();
}
function onMode(key, id, mode) {
  const i = editable(); if (!i) return;
  const l = lineOf(i, key, id), old = l.mode; l.mode = mode; l.ann = l.ann || {};
  markDirty(i, `#${id} annualized mode`, old, mode); renderKeep();
}
function onAnn(el) {
  const i = editable(); if (!i) return;
  const [key, id, kind] = el.dataset.ann.split("|"), l = lineOf(i, key, id);
  l.ann = l.ann || {}; const old = l.ann[kind];
  l.ann[kind] = el.value === "" ? null : Number(el.value);
  markDirty(i, `#${id} ${kind === "f" ? "forecast" : "actual"} annualized`, old, l.ann[kind]); renderKeep();
}
function onCell(el) {
  const i = editable(); if (!i) return;
  const [key, id, kind, ym] = el.dataset.cell.split("|"), l = lineOf(i, key, id);
  l.m = l.m || { f: {}, a: {} }; l.m[kind] = l.m[kind] || {};
  const old = l.m[kind][ym];
  if (el.value === "") delete l.m[kind][ym]; else l.m[kind][ym] = Number(el.value);
  markDirty(i, `#${id} ${kind === "f" ? "forecast" : "actual"} ${fmtDate(ym)}`, old ?? "", el.value === "" ? "" : Number(el.value)); renderKeep();
}
function toggleSel(id, on) { if (on) SEL.add(id); else SEL.delete(id); renderKeep(); }
function addLine(key) {
  const i = editable(); if (!i) return;
  i[key] = i[key] || [];
  const pre = key === "sustain" ? "S" : "I", n = i[key].reduce((m, l) => Math.max(m, +l.id.slice(1) || 0), 0) + 1;
  const id = pre + String(n).padStart(2, "0"), L = cfgList;
  const line = key === "sustain"
    ? { id, freq: "Recurring Benefit", type: L("susTypes")[0] || "", flagship: i.flagship || "", scope: L("scopes")[0] || "", mode: "auto", m: { f: {}, a: {} }, ann: {} }
    : { id, freq: "Recurring Benefit", type: L("impactTypes")[0] || "", pl: i.dept || "", mode: "auto", m: { f: {}, a: {} }, ann: {} };
  i[key].push(line); log(i, "edit", `Added ${key === "sustain" ? "sustainability" : "impact"} line #${id}`); save(); render();
}
function deleteLines(key) {
  const i = editable(); if (!i) return;
  const ids = [...SEL].filter(id => lineOf(i, key, id)); if (!ids.length) return;
  i[key] = i[key].filter(l => !ids.includes(l.id)); SEL = new Set();
  log(i, "edit", `Deleted ${key === "sustain" ? "sustainability" : "impact"} line(s) ${ids.map(x => "#" + x).join(", ")}`); save(); render();
}
// milestones -----------------------------------------------------------------
function onMs(el) {
  const i = editable(); if (!i) return;
  const [id, k] = el.dataset.ms.split("|"), m = i.milestones.find(x => x.id === id);
  if (k === "type" && el.value === "Money Step" && i.milestones.some(x => x.id !== id && x.type === "Money Step" && x.status !== "Cancelled")) {
    toast("Only one Money Step milestone is allowed. Change or cancel the existing one first.", "bad"); render(); return;
  }
  // Changing the Money Step completion date moves the L4 forecast date \u2192 confirm first (as in WAVE).
  if (k === "end" && m.type === "Money Step" && m.status !== "Cancelled" && el.value && el.value !== m.end) {
    PENDING_LINK = { id: i.id, kind: "ms", msId: id, value: el.value };
    render(); return;
  }
  const old = m[k]; m[k] = el.value;
  markDirty(i, `Milestone #${id} ${k}`, k === "owner" ? uname(old) : old, k === "owner" ? uname(el.value) : el.value);
  const prevL4 = i.tl.f.L4;
  if (moneyStep(i) && syncL4(i)) {
    markDirty(i, "L4 forecast date (from Money Step)", prevL4 || "", i.tl.f.L4);
    toast(`L4 forecast date is now ${fmtDate(i.tl.f.L4)} \u2014 linked to Money Step #${moneyStep(i).id}.`);
  }
  renderKeep();
}
// L4 forecast date edited on Timeline & Status \u2192 also moves the Money Step completion date.
function onL4(el) {
  const i = editable(); if (!i) return;
  const ms = moneyStep(i);
  if (ms && el.value) { PENDING_LINK = { id: i.id, kind: "l4", msId: ms.id, value: el.value }; render(); return; }
  const old = i.tl.f.L4; i.tl.f.L4 = el.value;
  markDirty(i, "L4 forecast date", old, el.value); renderKeep();
}
function confirmLink() {
  const p = PENDING_LINK, i = p && INIT(p.id); PENDING_LINK = null;
  if (!i || !canEdit(ME, i)) { render(); return; }
  const m = i.milestones.find(x => x.id === p.msId);
  const oldEnd = m ? m.end : "", oldL4 = forecastDate(i, "L4");
  if (m) m.end = p.value;
  i.tl.f.L4 = p.value;
  if (m) markDirty(i, `Money Step #${m.id} completion date`, oldEnd, p.value);
  markDirty(i, "L4 forecast date", oldL4, p.value);
  toast(`Money Step completion and L4 forecast date are now ${fmtDate(p.value)} (Impact Year ${p.value.slice(0, 4)}).`);
  render();
}
function cancelLink() { PENDING_LINK = null; toast("No change \u2014 dates kept."); render(); }
function addMilestone() {
  const i = editable(); if (!i) return;
  const n = i.milestones.reduce((x, m) => Math.max(x, +m.id.slice(1) || 0), 0) + 1, id = "M" + String(n).padStart(2, "0");
  i.milestones.push({ id, name: "", owner: i.owner || ME.id, type: "Implementation", status: "Not Started", start: "", end: "" });
  log(i, "edit", `Added milestone #${id}`); save(); render();
  const e = document.getElementById(`ms_${id}_name`); if (e) e.focus();
}
function deleteMilestones() {
  const i = editable(); if (!i) return;
  const ids = [...SEL].filter(id => i.milestones.some(m => m.id === id)); if (!ids.length) return;
  i.milestones = i.milestones.filter(m => !ids.includes(m.id)); SEL = new Set();
  log(i, "edit", `Deleted milestone(s) ${ids.map(x => "#" + x).join(", ")}`); save(); render();
}
// files (names only in this build) -------------------------------------------
function addCharterFiles(el) {
  const i = editable(); if (!i) return;
  const names = [...el.files].map(f => f.name); i.charter.files.push(...names);
  log(i, "edit", "Attached to charter: " + names.join(", ")); save(); render();
}
function removeCharterFile(k) { const i = editable(); if (!i) return; const [f] = i.charter.files.splice(k, 1); log(i, "edit", "Removed charter file " + f); save(); render(); }
function setAttachment(k, el) {
  const i = editable(); if (!i) return;
  const name = el && el.files && el.files[0] ? el.files[0].name : "";
  const old = i.attachments[k]; i.attachments[k] = name;
  log(i, "edit", name ? `Attachment ${k + 1}: ${name}` : `Removed attachment ${k + 1} (${old})`); save(); render();
}
// questionnaire --------------------------------------------------------------
function qRec(i, id) { i.q = i.q || {}; if (!i.q[id] || typeof i.q[id] !== "object") i.q[id] = { c: [], other: "" }; return i.q[id]; }
function onQ(id, k, on) {
  const i = editable(); if (!i) return;
  const a = qRec(i, id); a.c = on ? [...new Set([...(a.c || []), k])].sort() : (a.c || []).filter(x => x !== k);
  if (on) a.none = false;
  markDirty(i, `Questionnaire ${id.toUpperCase()}`, undefined, {}); renderKeep();
}
function onQNone(id, on) {
  const i = editable(); if (!i) return;
  const a = qRec(i, id); a.none = on; if (on) { a.c = []; a.other = ""; }
  markDirty(i, `Questionnaire ${id.toUpperCase()}`, undefined, {}); renderKeep();
}
function onQText(id, field, v) {
  const i = editable(); if (!i) return;
  const a = qRec(i, id); a[field] = v; if (field === "other" && v) a.none = false;
  markDirty(i, `Questionnaire ${id.toUpperCase()}`, undefined, {}); renderKeep();
}
function onQYes(id, v) { const i = editable(); if (!i) return; i.q = i.q || {}; const old = i.q[id]; i.q[id] = v; markDirty(i, `Questionnaire ${id.toUpperCase()}`, old, v); renderKeep(); }

// ---------- workflow actions ------------------------------------------------
function act(fn) { const i = CURI(); if (!i) return; commitDraft(false); const r = fn(i); if (r.ok) save(); report(r); OPEN = null; render(); }
const val = id => { const e = document.getElementById(id); return e ? e.value.trim() : ""; };
function doSubmit() { if (!editable()) return; act(i => submitGate(i)); }
function doApprove(role) {
  const c = val("gate_c");
  act(i => { const r = approveGate(i, role); if (r.ok && c) i.audit[i.audit.length - (i.submittedFor ? 1 : 2)].comment = c; return r; });
}
function doReject() { const c = val("gate_c"); act(i => rejectGate(i, c)); }
function doWithdraw() { if (!editable()) return; act(i => withdrawGate(i)); }
function doReturn() { if (!editable()) return; const c = val("ret_c"); act(i => returnStage(i, c)); }
function doStatus() { if (!editable()) return; const s = val("hold_s"), c = val("hold_c"); act(i => setStatus(i, s, c)); }
function doComment() {
  const i = CURI(), c = val("cm_t"); if (!i) return;
  if (!c) { toast("Write a comment first.", "bad"); return; }
  log(i, "comment", "Comment", c); save(); render();
}
function doLogin() {
  const u = U(val("lg_user")); if (!u) return;
  ME = u; ACTIVE_ROLE = val("lg_role") || u.roles[0]; saveSession();
  toast(`Signed in as ${u.name} (${roleName(ACTIVE_ROLE)}).`);
  go("#/home");
}
function doCreate(track) {
  const n = NEWF;
  if (!has(n.title) || !has(n.overview)) { toast("Enter the Initiative Name and Overview.", "bad"); return; }
  const data = { title: n.title.trim(), overview: n.overview.trim(), company: n.company || val("nf_co") || ME.company };
  if (track === "S") data.flagship = n.flagship || val("nf_fl"); else data.dept = n.dept || val("nf_dp");
  const i = createInitiative(track, data); save(); NEWF = {};
  toast(`Created ${i.id}. Complete the Overview and L1 Questionnaire, then submit for L2.`);
  go(`#/init/${i.id}/overview`);
}

// ---------- admin actions ---------------------------------------------------
function superOnly() { if (!isSuper(ME)) { toast("Only Super Admin can change this.", "bad"); return false; } return true; }
function toggleRole(uid, role, on) {
  if (!superOnly()) return;
  const u = U(uid); u.roles = on ? [...new Set([...u.roles, role])] : u.roles.filter(r => r !== role);
  save(); toast(`${u.name}: ${on ? "added" : "removed"} ${roleName(role)}.`);
  if (u.id === ME.id && !ME.roles.includes(ACTIVE_ROLE)) ACTIVE_ROLE = ME.roles[0] || "OWNER";
  OPEN = "r" + uid; renderKeep();
}
function addUser() {
  if (!superOnly()) return;
  const name = val("nu_name"), emp = val("nu_emp");
  if (!name || !emp) { toast("Enter the employee number and name.", "bad"); return; }
  const id = "u" + Date.now().toString(36);
  DB.users.push({ id, emp, name, email: val("nu_email"), company: val("nu_co") || "PTT", dept: val("nu_dept"), roles: ["OWNER"] });
  save(); toast(`Added ${name}.`); render();
}
function setPerm(role, track, idx, v) {
  if (!superOnly()) return;
  const p = DB.config.perms; p[role] = p[role] || {}; p[role][track] = p[role][track] || ["none", "none"]; p[role][track][idx] = v;
  save(); toast(`${roleName(role)} \u00b7 ${trackName(track)} updated.`);
}
function setRouting(role, uid) {
  if (!superOnly()) return;
  DB.config.routing = DB.config.routing || {};
  if (uid) DB.config.routing[role] = [uid]; else delete DB.config.routing[role];
  save(); toast(uid ? `${roleName(role)} now routes to ${uname(uid)}.` : `${roleName(role)} reset to the AD default.`); render();
}
function saveList(k) {
  if (!superOnly()) return;
  DB.config.lists[k] = val("ls_" + k).split("\n").map(s => s.trim()).filter(Boolean);
  save(); toast(`List \u201c${k}\u201d saved (${DB.config.lists[k].length} values).`);
}
function saveSettings() {
  if (!superOnly()) return;
  DB.config.theme = val("st_theme") || DB.config.theme;
  ["money", "emission"].forEach(k => DB.config.classes[k].forEach((c, idx) => { c[1] = Number(val(`cl_${k}_${idx}`)) || 0; }));
  save(); toast("Settings saved."); render();
}

// ---------- downloads -------------------------------------------------------
function downloadFile(name, text, type = "text/plain") {
  const blob = new Blob([text], { type }), url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function exportCSV(t) {
  const list = visible().filter(i => i.track === t);
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const csv = [DATA_COLS.map(c => q(c[0])).join(","), ...list.map(i => DATA_COLS.map(([, f]) => q(f(i))).join(","))].join("\r\n");
  downloadFile(`XcLENCE_${trackName(t)}_${todayISO()}.csv`, "\ufeff" + csv, "text/csv");
  toast(`Exported ${list.length} row(s).`);
}
function downloadCharterTemplate() {
  const i = CURI();
  downloadFile(`Charter_Template_${i ? i.id : "XcLENCE"}.md`, [
    `# Project Charter \u2014 ${i ? i.id + " " + i.title : ""}`, "", "## Current conditions (problem statement)", "", "## Goals / targets", "",
    "## Root cause analysis", "", "## Proposed solution / method", "", "## Expected result / confirmation", "",
    "## Key value driver and unit", "", "## Money Step (what event means no further action is needed)", ""].join("\n"), "text/markdown");
}

// ---------- boot ------------------------------------------------------------
async function boot() {
  try { DB = await load(); }
  catch (e) { APP().innerHTML = `<div class="card pad err">Couldn't load XcLENCE data: ${esc(e.message)}</div>`; return; }
  DB.initiatives.forEach(syncL4); // stored L4 forecast = Money Step completion date
  restoreSession();
  if (location.hash.startsWith("#/") && location.hash !== "#/login") NAV = location.hash;
  if (/^#\/init\/[^/]+\/(impact|sustain)/.test(NAV)) SCROLL_TODAY = true;
  LAST_PATH = parse().slice(0, 2).join("/");
  render();
}
boot();
